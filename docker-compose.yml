version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: fixhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fixhub_db
      POSTGRES_USER: fixhub_user
      POSTGRES_PASSWORD: fixhub_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixhub_user -d fixhub_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
