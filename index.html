    <!-- Suppress third-party browser extension unhandled exceptions (e.g. MetaMask, Phantom, Web3 wallet injection) -->
    <script>
      (function() {
        var isExtensionError = function(err) {
          if (!err) return false;
          var msg = typeof err === 'string' ? err : (err.message || err.reason || (err.error && err.error.message) || '');
          msg = String(msg).toLowerCase();
          return (
            msg.indexOf('metamask') !== -1 ||
            msg.indexOf('failed to connect to metamask') !== -1 ||
            msg.indexOf('ethereum') !== -1 ||
            msg.indexOf('chrome-extension://') !== -1 ||
            msg.indexOf('moz-extension://') !== -1 ||
            (msg.indexOf('wallet') !== -1 && msg.indexOf('connect') !== -1)
          );
        };

        window.addEventListener(
          'error',
          function(event) {
            if (isExtensionError(event.error) || isExtensionError(event.message)) {
              event.preventDefault();
              event.stopImmediatePropagation();
              return true;
            }
          },
          true
        );

        window.addEventListener(
          'unhandledrejection',
          function(event) {
            if (isExtensionError(event.reason)) {
              event.preventDefault();
              event.stopImmediatePropagation();
              return true;
            }
          },
          true
        );
      })();
    </script>
