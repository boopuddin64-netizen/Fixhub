# Render Blueprint: Fixhub STAGING on the FREE web service plan (no credit card, no paid services).
#   Render dashboard -> New -> Blueprint -> pick this repo -> fill the prompted secrets -> Apply.
# Full guide: docs/STAGING_DEPLOY.md
services:
  - type: web
    name: fixhub-staging            # public URL becomes https://fixhub-staging.onrender.com (a suffix is added if the name is taken)
    runtime: node
    plan: free                      # 512 MB RAM / 0.1 CPU, spins down after 15 min without traffic (keep warm with a pinger on /health)
    region: frankfurt               # closest free region to the Supabase London (eu-west-2) database
    branch: main
    autoDeployTrigger: checksPass   # redeploy only when the commit's GitHub Actions CI is green
    buildCommand: bun install --frozen-lockfile && bun run build
    startCommand: node dist/server.cjs
    healthCheckPath: /health
    maxShutdownDelaySeconds: 30     # SIGTERM -> server flushes state + releases the writer lock in well under 30s
    envVars:
      # --- runtime / build
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.19.2
      - key: BUN_VERSION            # bun.lock is written by bun 1.4.x (CI uses latest); Render's default 1.3.x may reject --frozen-lockfile
        value: 1.4.2
      # PORT is injected by Render (10000); APP_URL falls back to Render's RENDER_EXTERNAL_URL automatically.

      # --- single writer + Render's "start the new instance before stopping the old one" deploys
      - key: EARLY_LISTEN           # open the port at once (/health = "starting") while waiting for the writer lock
        value: "true"
      - key: WRITER_LOCK_WAIT_MS    # Render sends SIGTERM to the old instance ~60s after switching traffic: wait longer than that
        value: "120000"

      # --- staging switches (remove all three at launch, see docs/STAGING_DEPLOY.md)
      - key: ALLOW_PAYSTACK_TEST_KEY
        value: "true"
      - key: SMS_DEV_MODE
        value: "true"
      - key: ALLOW_SMS_LOG_OTP
        value: "true"

      - key: PLATFORM_COMMISSION_PERCENT
        value: "8.5"

      # --- secrets (names only: values are typed into the Render dashboard, never committed)
      - key: DATABASE_URL           # Supabase SESSION pooler string (port 5432, sslmode=require&uselibpqcompat=true)
        sync: false
      - key: JWT_SECRET             # random 256-bit value generated by Render once, then kept
        generateValue: true
      - key: PAYSTACK_SECRET_KEY    # Paystack TEST secret key (sk_test_...) for staging; the LIVE key only at launch
        sync: false
      - key: ADMIN_BOOTSTRAP_EMAIL  # one-time first admin; REMOVE both after the first sign-in at /admin
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
